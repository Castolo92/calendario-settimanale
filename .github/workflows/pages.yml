name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compila
        run: dotnet publish CalendarioSettimanale.csproj -c Release -o out

      - name: Adatta al percorso di GitHub Pages
        run: |
          cd out/wwwroot
          # Il sito vive in https://<utente>.github.io/<repository>/
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' index.html
          # Le pagine come /pianifica non esistono come file: GitHub mostra 404.html,
          # che è una copia dell'app e la fa partire sulla pagina giusta
          cp index.html 404.html
          # Senza questo file GitHub ignora la cartella _framework
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
